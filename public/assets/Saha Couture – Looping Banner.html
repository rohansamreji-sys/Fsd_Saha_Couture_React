<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saha Couture – Banner</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:#fff7f3}
.banner{position:relative;width:100%;aspect-ratio:16/7;min-height:260px;overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif;color:#4a1f3a}
.stage{position:absolute;inset:0;opacity:0;animation:st 10s linear infinite}
.stage:nth-child(1){animation-delay:0s;background:linear-gradient(110deg,#ffe3ec,#fff3e6)}
.stage:nth-child(2){animation-delay:-8s;background:linear-gradient(110deg,#e6f1ff,#fdeef6)}
.stage:nth-child(3){animation-delay:-6s;background:linear-gradient(110deg,#e9e4f5,#f7ecf0)}
.stage:nth-child(4){animation-delay:-4s;background:linear-gradient(110deg,#ffe0b8,#ffc9d8)}
.stage:nth-child(5){animation-delay:-2s;background:linear-gradient(110deg,#d8efe6,#f9e6c8)}
@keyframes st{0%{opacity:1}20%{opacity:1}24%{opacity:0}96%{opacity:0}100%{opacity:1}}
.stage svg{position:absolute;right:6%;bottom:0;height:96%;width:auto}
.label{position:absolute;left:6%;bottom:12%;font-size:clamp(14px,2.2vw,28px);letter-spacing:.35em;text-transform:uppercase;opacity:.8}
.brand{position:absolute;left:6%;top:18%;z-index:3}
.brand h1{margin:0;font-weight:500;font-size:clamp(34px,7vw,96px);line-height:1;letter-spacing:.04em}
.brand p{margin:.5em 0 0;font-style:italic;font-size:clamp(14px,2vw,26px)}
.b{position:absolute;left:-6%;z-index:4;opacity:0;animation:fly 10s linear infinite}
.b svg{width:100%;height:auto;animation:flap .35s ease-in-out infinite alternate;display:block}
@keyframes fly{0%{transform:translate(0,0);opacity:0}8%{opacity:1}50%{transform:translate(55vw,-6vh)}92%{opacity:1}100%{transform:translate(112vw,4vh);opacity:0}}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.35)}}
@media (prefers-reduced-motion:reduce){.stage,.b,.b svg{animation:none}.stage:nth-child(1){opacity:1}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>

</defs></svg>

<div class="brand"><h1>Saha Couture</h1><p>From first frocks to forever sarees</p></div>
